<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heo Thì - Dashboard Sức Khỏe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

    <div id="toast-container"></div>

    <!-- MODAL NHẬP THÔNG TIN BAN ĐẦU -->
    <div id="user-modal" class="modal">
        <div class="modal-content glass">
            <h2>Hồ Sơ Sức Khỏe - Heo Thì 🌸</h2>
            <p class="subtitle">Nhập thông tin để hệ thống tính toán chỉ số chính xác cho bạn.</p>
            
            <form id="health-form" onsubmit="saveHealthForm(event)">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Cân nặng (kg):</label>
                        <input type="number" id="weight" step="0.1" required placeholder="50">
                    </div>
                    <div class="input-group">
                        <label>Chiều cao (cm):</label>
                        <input type="number" id="height" required placeholder="160">
                    </div>
                    <div class="input-group">
                        <label>Tuổi:</label>
                        <input type="number" id="age" required placeholder="22">
                    </div>
                    <div class="input-group">
                        <label>Giới tính:</label>
                        <select id="gender">
                            <option value="female">Nữ</option>
                            <option value="male">Nam</option>
                        </select>
                    </div>
                    <div class="input-group full-width">
                        <label>Mức độ vận động:</label>
                        <select id="activity">
                            <option value="1.2">Ít vận động (Dân văn phòng, chỉ ngồi)</option>
                            <option value="1.375">Vận động nhẹ (Tập 1-3 buổi/tuần)</option>
                            <option value="1.55">Vận động vừa (Tập 3-5 buổi/tuần)</option>
                            <option value="1.725">Vận động nhiều (Tập 6-7 buổi/tuần)</option>
                        </select>
                    </div>
                    <div class="input-group full-width">
                        <label>Mục tiêu cân nặng:</label>
                        <select id="goal">
                            <option value="maintain">Giữ cân hiện tại</option>
                            <option value="lose">Giảm cân nhẹ nhàng</option>
                            <option value="gain">Tăng cân / Tăng cơ</option>
                        </select>
                    </div>
                    <!-- THÊM TRƯỜNG GEMINI API KEY -->
                    <div class="input-group full-width">
                        <label>Gemini API Key (Tùy chọn):</label>
                        <input type="password" id="api-key" placeholder="Nhập API Key của bạn để sử dụng AI ổn định">
                    </div>
                </div>
                <button type="submit" class="btn-primary">Lưu & Bắt đầu</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD LAYOUT -->
    <div class="dashboard-container">
        <aside class="sidebar glass">
            <div class="logo">
                <h2>Heo Thì 💜</h2>
            </div>
            
            <nav class="nav-menu">
                <button type="button" class="nav-btn active" onclick="switchTab('overview', this)"><i class='bx bx-grid-alt'></i> Tổng quan</button>
                <button type="button" class="nav-btn" onclick="switchTab('sleep', this)"><i class='bx bx-moon'></i> Giấc ngủ</button>
                <button type="button" class="nav-btn" onclick="switchTab('water', this)"><i class='bx bx-water'></i> Uống nước</button>
                <button type="button" class="nav-btn" onclick="switchTab('food', this)"><i class='bx bx-bowl-rice'></i> Ăn uống</button>
                <button type="button" class="nav-btn" onclick="switchTab('workout', this)"><i class='bx bx-run'></i> Thể thao</button>
            </nav>

            <div class="sidebar-bottom">
                <div id="auth-status" class="auth-box">
                    <button type="button" id="btn-login" onclick="loginGoogle()" class="btn-secondary"><i class='bx bxl-google'></i> Đăng nhập</button>
                </div>
                <div class="theme-toggle">
                    <button type="button" class="icon-btn" onclick="openSettingsModal()" title="Cài đặt chỉ số"><i class='bx bx-cog'></i></button>
                    <button type="button" class="icon-btn" onclick="toggleDarkMode()" title="Đổi giao diện"><i class='bx bx-moon'></i></button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <!-- 0. TỔNG QUAN -->
            <section id="overview" class="tab-content active">
                <div class="header-title">
                    <h1>Tổng quan Chỉ số 📊</h1>
                </div>
                <div class="stats-grid">
                    <div class="stat-card glass">
                        <i class='bx bx-body icon'></i>
                        <div>
                            <h3>BMI</h3>
                            <p id="stat-bmi" class="stat-value">--</p>
                            <span id="stat-bmi-text" class="stat-desc">Chưa có dữ liệu</span>
                        </div>
                    </div>
                    <div class="stat-card glass">
                        <i class='bx bx-flame icon'></i>
                        <div>
                            <h3>BMR (Tối thiểu)</h3>
                            <p id="stat-bmr" class="stat-value">-- kcal</p>
                            <span class="stat-desc">Năng lượng sống cơ bản</span>
                        </div>
                    </div>
                    <div class="stat-card glass">
